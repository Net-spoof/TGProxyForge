name: Bash syntax

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: |
          bash -n install.sh
          bash -n tgproxy
          for f in lib/*.sh; do bash -n "$f"; done
      - name: Python monitor syntax and unit tests
        run: |
          python3 -m py_compile lib/monitor.py
          python3 -m unittest discover -s tests -v
